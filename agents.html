.ag label{display:block;font-weight:600;margin:12px 0 4px;font-size:15px}

.ag textarea{min-height:90px;resize:vertical}.ag textarea.big{min-height:220px}.ag input[type=color]{width:64px;height:40px;padding:2px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.ag h2{margin-top:28px}.ag .row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.ag .card{border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--surface);margin:10px 0}
.ag button.b{padding:10px 16px;border-radius:8px;border:1px solid var(--rust);background:var(--rust);color:var(--rust-contrast);font:600 16px inherit;font-family:inherit;cursor:pointer}.ag button.b.s{background:transparent;color:var(--rust)}
.ag pre{white-space:pre-wrap;word-break:break-all;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:13px}.ag .msg{padding:10px;border-radius:8px;margin:10px 0;background:var(--ok-bg);color:var(--ink)}.ag .msg.err{background:#fde8e8;color:#8a1c1c}
