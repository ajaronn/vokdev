<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Test-App – Karteikasten Developer</title>
<link rel="stylesheet" href="style.css"></head>
<body><main class="wrap">
<h1>Test-App</h1>
<p class="muted">Simuliert eine Dritt-App mit „Mit Karteikasten fortfahren“. Trage deine client_id der Test-App ein.</p>
<div class="card">
  <label class="f" for="cid">client_id der Test-App</label><input type="text" id="cid">
  <div class="btns" style="margin-top:14px"><button class="btn primary" id="login">Mit Karteikasten fortfahren</button><button class="btn" id="out">Abmelden</button></div>
</div>
<div class="card" id="api" hidden style="margin-top:16px">
  <h2>API-Test</h2>
  <div class="btns">
    <button class="btn small" data-p="/me">GET /me</button>
    <button class="btn small" data-p="/lists">GET /lists</button>
    <button class="btn small" data-p="/progress">GET /progress</button>
    <button class="btn small" id="mk">POST /lists (Testliste)</button>
  </div>
  <pre id="res" style="margin-top:14px">–</pre>
</div>
<p class="foot"><a href="./">Zur Developer-Seite</a></p>
</main>
<script>
var SB='https://qujcvvxdvpqnsfgvleid.supabase.co', REDIR=location.origin+location.pathname;
var KEY='ajaronn_test_app', $=function(i){return document.getElementById(i)};
$('cid').value=localStorage.getItem(KEY+'_cid')||'';
function b64(buf){var s='';new Uint8Array(buf).forEach(function(b){s+=String.fromCharCode(b)});return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function rnd(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return b64(a)}
$('login').onclick=function(){var cid=$('cid').value.trim();if(!cid)return alert('client_id fehlt');localStorage.setItem(KEY+'_cid',cid);
  var v=rnd(48),st=rnd(16);crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)).then(function(h){sessionStorage.setItem(KEY,JSON.stringify({v:v,s:st}));
  location.assign(SB+'/auth/v1/oauth/authorize?'+new URLSearchParams({response_type:'code',client_id:cid,redirect_uri:REDIR,scope:'email profile',state:st,code_challenge:b64(h),code_challenge_method:'S256'}))})};
$('out').onclick=function(){localStorage.removeItem(KEY+'_tok');location.reload()};
function show(x){$('res').textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}
function call(p,o){o=o||{};return fetch(SB+'/functions/v1/dev-api/v1'+p,{method:o.method||'GET',headers:{authorization:'Bearer '+localStorage.getItem(KEY+'_tok'),'content-type':'application/json'},body:o.body}).then(function(r){return r.text().then(function(t){show(r.status+'\n'+t)})})}
document.querySelectorAll('[data-p]').forEach(function(b){b.onclick=function(){call(b.dataset.p)}});
$('mk').onclick=function(){call('/lists',{method:'POST',body:JSON.stringify({name:'API-Testliste'})})};
var q=new URLSearchParams(location.search);
if(q.get('code')){var s=JSON.parse(sessionStorage.getItem(KEY)||'{}');history.replaceState(null,'',REDIR);
  if(s.s!==q.get('state'))alert('state stimmt nicht');else
  fetch(SB+'/auth/v1/oauth/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded',apikey:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1amN2dnhkdnBxbnNmZ3ZsZWlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwODQ3OTcsImV4cCI6MjEwNTY2MDc5N30.aNsVqELIJTSDIuJOEj6CL_ii2NL6JUBjZRDb3ZtcTWY'},
  body:new URLSearchParams({grant_type:'authorization_code',code:q.get('code'),redirect_uri:REDIR,client_id:localStorage.getItem(KEY+'_cid'),code_verifier:s.v}).toString()})
  .then(function(r){return r.json()}).then(function(j){if(j.access_token){localStorage.setItem(KEY+'_tok',j.access_token);location.reload()}else alert(JSON.stringify(j))})}
else if(q.get('error'))show('Abgelehnt: '+q.get('error'));
if(localStorage.getItem(KEY+'_tok'))$('api').hidden=false;
</script></body></html>
